<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank you — Lunaval</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #fafaf7; --ink: #1a1a1a; --ink-muted: #6b6b68; --line: #e7e5e0; --surface: #fff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: 'Inter Tight', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 56px 64px; max-width: 480px; text-align: center; box-shadow: 0 2px 20px rgba(0,0,0,0.03); }
    .checkmark { width: 64px; height: 64px; border-radius: 50%; background: #e8f5e9; color: #2e7d32; display: inline-flex; align-items: center; justify-content: center; font-size: 32px; margin-bottom: 20px; }
    h1 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 28px; letter-spacing: -0.02em; margin: 0 0 12px; }
    p { color: var(--ink-muted); line-height: 1.6; margin: 0 0 20px; }
    .order-id { font-family: 'Fraunces', serif; font-size: 14px; color: var(--ink); background: var(--bg); padding: 10px 16px; border-radius: 6px; display: inline-block; margin-bottom: 24px; font-variant-numeric: tabular-nums; }
    .back { display: inline-block; padding: 12px 24px; background: var(--ink); color: var(--surface); text-decoration: none; border-radius: 6px; font-weight: 500; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="checkmark">✓</div>
    <h1>Thank you for your order</h1>
    <p>Your payment was received. You'll receive access to your Lunaval subscription shortly.</p>
    <div class="order-id" id="order-id">Order confirmed</div>
    <br>
    <a class="back" href="/">Back to home</a>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('order');
    if (orderId) document.getElementById('order-id').textContent = 'Order #' + orderId;
  </script>
</body>
</html>
